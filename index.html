<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Barchalor Social - Qlito bady s Owner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f0f2f5}
header{position:sticky;top:0;z-index:99;background:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.logo{font-weight:900;color:#0866ff;font-size:24px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.1);margin-bottom:14px}
.main{max-width:1250px;margin:auto;display:grid;grid-template-columns:260px 1fr 300px;gap:14px;padding:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#0866ff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.btn{background:#0866ff;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.post-img{width:100%;border-radius:10px;margin-top:10px;max-height:400px;object-fit:cover}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;margin-top:10px;padding-top:8px;color:#65676b}
.actions b{cursor:pointer}
.chat-box{position:fixed;bottom:0;right:20px;width:300px;height:380px;background:#fff;border-radius:12px 12px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:200}
.chat-box.active{display:flex}
.chat-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:18px;max-width:75%}.me{align-self:flex-end;background:#0866ff;color:#fff}.them{align-self:flex-start;background:#f0f2f5}
.owner-badge{background:linear-gradient(90deg,#ffd700,#ffae00);padding:2px 7px;border-radius:10px;font-size:11px;font-weight:800;color:#000}
@media(max-width:900px){.main{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<header>
<div class="logo">barchalor</div>
<div><b>Qlito bady s <span class="owner-badge">👑 OWNER</span></b></div>
</header>

<div class="main">
<div class="hide-m">
<div class="card"><b>👑 Owner: Qlito bady s</b><br><small>You control everything</small><br><br><span style="color:green">● 1,247 users online</span></div>
<div class="card"><p>🏠 News Feed</p><br><p>👥 Friends</p><br><p>💬 Messenger</p><br><p>🔔 Notifications (3)</p></div>
</div>

<div>
<div class="card">
<div style="display:flex;gap:10px"><div class="avatar">Q</div><input id="txt" placeholder="What's on your mind, Qlito?" style="flex:1;background:#f0f2f5;border:none;border-radius:20px;padding:10px 14px;outline:none"/></div>
<div style="margin-top:10px;display:flex;gap:8px;align-items:center">
<input type="file" id="imgInp" accept="image/*" hidden onchange="previewImg(event)"/>
<button onclick="document.getElementById('imgInp').click()" style="border:none;background:#f0f2f5;padding:8px 12px;border-radius:8px;cursor:pointer">📸 Photo</button>
<span id="imgName" style="font-size:12px"></span>
</div>
<img id="preview" style="display:none;width:100%;border-radius:10px;margin-top:10px;max-height:250px;object-fit:cover"/>
<button class="btn" style="width:100%;margin-top:10px" onclick="makePost()">Post as Owner 👑</button>
</div>
<div id="feed"></div>
</div>

<div class="hide-m">
<div class="card"><b>Contacts - Messenger</b><small style="display:block;margin:6px 0;color:#65676b">Click to chat</small>
<div onclick="openChat('Amara')" style="display:flex;gap:10px;padding:8px;cursor:pointer"><div class="avatar" style="background:#e1306c">A</div><div>Amara<br><small style="color:green">● online</small></div></div>
<div onclick="openChat('John')" style="display:flex;gap:10px;padding:8px;cursor:pointer"><div class="avatar" style="background:#000">J</div><div>John<br><small style="color:green">● online</small></div></div>
<div onclick="openChat('Blessing')" style="display:flex;gap:10px;padding:8px;cursor:pointer"><div class="avatar" style="background:#ff9900">B</div><div>Blessing<br><small>active 2m ago</small></div></div>
</div>
</div>
</div>

<!-- Messenger Popup -->
<div id="chatBox" class="chat-box">
<div style="padding:12px;background:#0866ff;color:#fff;border-radius:12px 12px 0 0;display:flex;justify-content:space-between"><b id="chatName">Chat</b><span onclick="closeChat()" style="cursor:pointer">✕</span></div>
<div id="chatMsgs" class="chat-msgs"></div>
<div style="display:flex;padding:8px;border-top:1px solid #eee"><input id="chatInput" placeholder="Aa" style="flex:1;border:none;background:#f0f2f5;border-radius:20px;padding:8px 12px;outline:none" onkeydown="if(event.key==='Enter')sendChat()"/><button class="btn" style="margin-left:6px" onclick="sendChat()">Send</button></div>
</div>

<script>
let posts = JSON.parse(localStorage.getItem('b_posts_v3')||'[]');
let currentChatUser=null;
let chats = JSON.parse(localStorage.getItem('b_chats')||'{}');
let pendingImg=null;

function previewImg(e){
const file=e.target.files[0];
if(!file)return;
document.getElementById('imgName').innerText=file.name;
const reader=new FileReader();
reader.onload=function(ev){pendingImg=ev.target.result;document.getElementById('preview').src=pendingImg;document.getElementById('preview').style.display='block';};
reader.readAsDataURL(file);
}

function render(){
const feed=document.getElementById('feed');
feed.innerHTML='';
posts.forEach((p,i)=>{
feed.innerHTML+=`<div class="card">
<div style="display:flex;justify-content:space-between"><div style="display:flex;gap:10px"><div class="avatar">${p.name[0]}</div><div><b>${p.name} ${p.isOwner?'<span class="owner-badge">👑 OWNER</span>':''}</b><br><small>${p.time}</small></div></div><span onclick="posts.splice(${i},1);save()" style="cursor:pointer;color:red">🗑️</span></div>
<p style="margin:10px 0">${p.text}</p>
${p.img?`<img src="${p.img}" class="post-img"/>`:''}
<div class="actions"><b onclick="like(${i})">👍 Like (${p.likes})</b><b>💬 Comment</b><b>↗️ Share</b></div>
</div>`;
});
}
function save(){localStorage.setItem('b_posts_v3',JSON.stringify(posts));render();}
function makePost(){
const t=document.getElementById('txt').value;
if(!t &&!pendingImg)return alert('Write something or add image');
posts.unshift({name:'Qlito bady s',text:t||'📸 Photo post',likes:0,time:'Just now',isOwner:true,img:pendingImg});
document.getElementById('txt').value='';pendingImg=null;document.getElementById('preview').style.display='none';document.getElementById('imgName').innerText='';
save();
}
function like(i){posts[i].likes++;save();}

// CHAT SYSTEM
function openChat(name){
currentChatUser=name;
document.getElementById('chatName').innerText=name;
document.getElementById('chatBox').classList.add('active');
if(!chats[name])chats[name]=[{from:'them',text:'Hey Qlito! I love Barchalor 👑'}];
renderChat();
}
function closeChat(){document.getElementById('chatBox').classList.remove('active')}
function renderChat(){
const box=document.getElementById('chatMsgs');
box.innerHTML='';
(chats[currentChatUser]||[]).forEach(m=>{
box.innerHTML+=`<div class="msg ${m.from==='me'?'me':'them'}">${m.text}</div>`;
});
box.scrollTop=box.scrollHeight;
}
function sendChat(){
const inp=document.getElementById('chatInput');
if(!inp.value)return;
if(!chats[currentChatUser])chats[currentChatUser]=[];
chats[currentChatUser].push({from:'me',text:inp.value});
inp.value='';
localStorage.setItem('b_chats',JSON.stringify(chats));
renderChat();
setTimeout(()=>{
chats[currentChatUser].push({from:'them',text:'Seen ✔️ Nice!'});
localStorage.setItem('b_chats',JSON.stringify(chats));
renderChat();
},1000);
}
if(posts.length===0){
posts=[{name:'Qlito bady s',text:'Welcome to Barchalor V3! Now you can post IMAGES 📸 and chat with Messenger 💬 I am the Owner 👑',likes:24,time:'Just now',isOwner:true,img:null}];
save();
}
render();
</script>
</body>
                                                          </html>
