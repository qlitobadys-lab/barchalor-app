<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barchalor — Connect with Everyone</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --red: #e11d48;
  --bg: #f0f2f5;
  --white: #fff;
  --text: #202124;
  --muted: #65676b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  background: white;
  padding: 14px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 4px #0001;
  position: sticky;
  top: 0;
  z-index: 5;
}

.logo {
  color: var(--red);
  font-size: 27px;
  font-weight: 900;
}

#account {
  font-size: 13px;
  color: var(--muted);
}

.primary {
  background: var(--red);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 11px 16px;
  font-weight: 700;
}

.secondary {
  background: #eee;
  color: #222;
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  font-weight: 600;
}

#auth {
  width: min(420px, 92%);
  margin: 55px auto;
  background: white;
  padding: 26px;
  border-radius: 14px;
  box-shadow: 0 3px 15px #0001;
}

#auth h1 {
  text-align: center;
  color: var(--red);
  font-size: 38px;
}

#auth p {
  text-align: center;
  color: var(--muted);
  margin: 8px 0 22px;
}

#auth input {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: 1px solid #ddd;
  border-radius: 8px;
}

#auth .primary {
  width: 100%;
  margin-top: 12px;
}

.switch {
  display: block;
  text-align: center;
  color: var(--red);
  margin-top: 17px;
  cursor: pointer;
}

#status {
  font-size: 14px;
  margin-top: 14px;
  overflow-wrap: anywhere;
}

#app {
  display: none;
}

.layout {
  display: grid;
  grid-template-columns: 230px minmax(0, 650px) 230px;
  justify-content: center;
  gap: 20px;
  padding: 22px 15px;
}

.panel {
  background: white;
  border-radius: 12px;
  padding: 18px;
  height: fit-content;
}

.panel h3 {
  margin-bottom: 10px;
}

.muted {
  color: var(--muted);
  font-size: 13px;
}

.composer {
  background: white;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 18px;
}

.composer textarea {
  width: 100%;
  min-height: 95px;
  resize: vertical;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin-bottom: 10px;
}

.composer .primary {
  width: 100%;
}

.post {
  background: white;
  border-radius: 12px;
  padding: 17px;
  margin-bottom: 14px;
  overflow-wrap: anywhere;
}

.post-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 13px;
}

.avatar {
  background: #ffe0e7;
  color: var(--red);
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-weight: 800;
  flex-shrink: 0;
}

.post-content {
  white-space: pre-wrap;
  line-height: 1.5;
  margin-bottom: 15px;
}

.post-actions {
  border-top: 1px solid #eee;
  padding-top: 10px;
  display: flex;
  gap: 12px;
}

.post-actions button {
  border: none;
  background: transparent;
  padding: 6px;
  color: var(--muted);
}

.post-actions button.liked {
  color: var(--red);
  font-weight: 800;
}

.comments {
  margin-top: 12px;
}

.comment {
  background: #f0f2f5;
  border-radius: 10px;
  padding: 9px 12px;
  margin-top: 8px;
  font-size: 14px;
}

.comment-form {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.comment-form input {
  width: 100%;
  min-width: 0;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 10px;
}

.comment-form button {
  border: none;
  background: var(--red);
  color: white;
  border-radius: 20px;
  padding: 0 13px;
}

#feedStatus {
  text-align: center;
  color: var(--muted);
  padding: 25px 10px;
}

@media (max-width: 850px) {
  .layout {
    grid-template-columns: minmax(0, 650px);
  }

  .left-panel, .right-panel {
    display: none;
  }
}

@media (max-width: 480px) {
  header {
    padding: 12px;
  }

  .logo {
    font-size: 23px;
  }

  .layout {
    padding: 12px 8px;
  }

  #auth {
    margin-top: 30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">barchalor</div>
  <div id="account"></div>
  <button id="logout" class="secondary" style="display:none"
    onclick="logout()">Log out</button>
</header>

<section id="auth">
  <h1>barchalor</h1>
  <p>Your community. Your people.</p>

  <form id="authForm">
    <input id="email" type="email"
      placeholder="Email address" autocomplete="email" required>

    <input id="password" type="password"
      placeholder="Password (minimum 8 characters)"
      minlength="8" autocomplete="current-password" required>

    <button id="authButton" class="primary" type="submit">
      Log in
    </button>
  </form>

  <span class="switch" id="switchMode">
    Don't have an account? Sign up
  </span>

  <div id="status" role="status" aria-live="polite"></div>
</section>

<section id="app">
  <div class="layout">

    <aside class="panel left-panel">
      <h3>🌍 Your community</h3>
      <p class="muted">
        Meet people, share your thoughts and join the conversation.
      </p>
    </aside>

    <main>
      <div class="composer">
        <h3 style="margin-bottom:12px">Create a post</h3>

        <form id="postForm">
          <textarea id="postText"
            maxlength="5000"
            placeholder="What's on your mind?"
            required></textarea>

          <button id="postButton" class="primary" type="submit">
            Publish post
          </button>
        </form>
      </div>

      <div id="feedStatus">Loading posts...</div>
      <div id="feed"></div>
    </main>

    <aside class="panel right-panel">
      <h3>💬 Community</h3>
      <p class="muted">
        Likes, comments and conversations bring Barchalor together.
      </p>
    </aside>

  </div>
</section>

<script>
const SUPABASE_URL =
  'https://vlxmxsghxejvirrcdtdn.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_JKROndaY1L0GG8xjuBcSjg_xmV8TrNE';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let signingUp = false;
let busy = false;
let likedPosts = new Set();

const $ = id => document.getElementById(id);

function showStatus(message, error = false) {
  $('status').textContent = message;
  $('status').style.color = error ? '#b42318' : '#167d43';
}

function setBusy(value) {
  busy = value;
  $('authButton').disabled = value;
  $('postButton').disabled = value;
}

$('switchMode').addEventListener('click', () => {
  signingUp = !signingUp;

  $('authButton').textContent =
    signingUp ? 'Create account' : 'Log in';

  $('switchMode').textContent =
    signingUp
      ? 'Already have an account? Log in'
      : "Don't have an account? Sign up";

  $('password').setAttribute(
    'autocomplete',
    signingUp ? 'new-password' : 'current-password'
  );

  showStatus('');
});

$('authForm').addEventListener('submit', async event => {
  event.preventDefault();

  if (busy) return;

  const email = $('email').value.trim();
  const password = $('password').value;

  if (signingUp && password.length < 8) {
    return showStatus(
      'Your password must contain at least 8 characters.',
      true
    );
  }

  setBusy(true);
  showStatus(signingUp ? 'Creating account...' : 'Logging in...');

  try {
    if (signingUp) {
      const { data, error } = await db.auth.signUp({
  email,
  password,
  options: {
    emailRedirectTo: 'https://qlitobadys-lab.github.io/barchalor-app/'
  }
});

      if (data.session) {
        showStatus('Account created successfully!');
        await initialise();
      } else {
        showStatus(
          'Account created! Check your email for the confirmation link, then log in.'
        );
      }
    } else {
      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      showStatus('Login successful!');
      await initialise();
    }
  } catch (error) {
    showStatus(error.message || 'Something went wrong.', true);
  } finally {
    setBusy(false);
  }
});

async function ensureProfile(user) {
  const { data, error } = await db
    .from('profiles')
    .select('id')
    .eq('id', user.id)
    .maybeSingle();

  if (error) throw error;
  if (data) return;

  const username = 'user_' + user.id.replaceAll('-', '').slice(0, 12);

  const { error: insertError } = await db
    .from('profiles')
    .insert({
      id: user.id,
      username,
      display_name: user.email.split('@')[0]
    });

  if (insertError) throw insertError;
}

async function initialise() {
  const { data, error } = await db.auth.getUser();

  if (error || !data.user) {
    currentUser = null;
    $('app').style.display = 'none';
    $('auth').style.display = 'block';
    $('logout').style.display = 'none';
    $('account').textContent = '';
    return;
  }

  currentUser = data.user;

  try {
    await ensureProfile(currentUser);
  } catch (error) {
    console.error('Profile setup:', error);
    // The user can still sign in. Profile errors will be
    // shown in the feed status while we troubleshoot.
  }

  $('auth').style.display = 'none';
  $('app').style.display = 'block';
  $('logout').style.display = 'inline-block';
  $('account').textContent = currentUser.email;

  await loadFeed();
}

$('postForm').addEventListener('submit', async event => {
  event.preventDefault();

  if (!currentUser || busy) return;

  const content = $('postText').value.trim();
  if (!content) return;

  setBusy(true);

  try {
    const { error } = await db
      .from('posts')
      .insert({
        user_id: currentUser.id,
        content
      });

    if (error) throw error;

    $('postText').value = '';
    await loadFeed();
  } catch (error) {
    $('feedStatus').textContent =
      'Could not publish: ' + error.message;
  } finally {
    setBusy(false);
  }
});

async function loadFeed() {
  $('feedStatus').textContent = 'Loading posts...';
  $('feed').replaceChildren();

  const { data: posts, error } = await db
    .from('posts')
    .select('id, user_id, content, created_at')
    .order('created_at', { ascending: false })
    .limit(50);

  if (error) {
    $('feedStatus').textContent =
      'Could not load posts: ' + error.message;
    return;
  }

  if (!posts || posts.length === 0) {
    $('feedStatus').textContent =
      'No posts yet. Be the first to share something!';
    return;
  }

  $('feedStatus').textContent = '';

  const userIds = [...new Set(posts.map(post => post.user_id))];

  const { data: profiles, error: profileError } = await db
    .from('profiles')
    .select('id, username, display_name')
    .in('id', userIds);

  if (profileError) {
    $('feedStatus').textContent =
      'Could not load profiles: ' + profileError.message;
    return;
  }

  const profileMap = new Map(
    (profiles || []).map(profile => [profile.id, profile])
  );

  const { data: likes, error: likeError } = await db
    .from('post_likes')
    .select('post_id, user_id')
    .in('post_id', posts.map(post => post.id));

  if (likeError) {
    $('feedStatus').textContent =
      'Could not load likes: ' + likeError.message;
    return;
  }

  likedPosts = new Set(
    (likes || [])
      .filter(like => like.user_id === currentUser.id)
      .map(like => String(like.post_id))
  );

  for (const post of posts) {
    renderPost(
      post,
      profileMap.get(post.user_id),
      (likes || []).filter(like => like.post_id === post.id).length
    );
  }
}

function renderPost(post, profile, likeCount) {
  const article = document.createElement('article');
  article.className = 'post';

  const head = document.createElement('div');
  head.className = 'post-head';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = (
    profile?.display_name || profile?.username || '?'
  ).charAt(0).toUpperCase();

  const details = document.createElement('div');

  const name = document.createElement('strong');
  name.textContent =
    profile?.display_name || profile?.username || 'Barchalor member';

  const time = document.createElement('div');
  time.className = 'muted';
  time.textContent = new Date(post.created_at).toLocaleString();

  details.append(name, time);
  head.append(avatar, details);

  const content = document.createElement('div');
  content.className = 'post-content';
  content.textContent = post.content || '';

  const actions = document.createElement('div');
  actions.className = 'post-actions';

  const likeButton = document.createElement('button');
  likeButton.className =
    likedPosts.has(String(post.id)) ? 'liked' : '';
  likeButton.textContent = '👍 Like (' + likeCount + ')';
  likeButton.addEventListener('click', () => toggleLike(post.id));

  const commentButton = document.createElement('button');
  commentButton.textContent = '💬 Comments';
  commentButton.addEventListener('click', () => {
    const form = article.querySelector('.comment-form');
    if (form) form.hidden = !form.hidden;
  });

  actions.append(likeButton, commentButton);

  const comments = document.createElement('div');
  comments.className = 'comments';
  comments.id = 'comments-' + post.id;

  const form = document.createElement('form');
  form.className = 'comment-form';
  form.hidden = true;

  const input = document.createElement('input');
  input.placeholder = 'Write a comment...';
  input.maxLength = 2000;
  input.required;

  const send = document.createElement('button');
  send.textContent = 'Send';
  send.type = 'submit';

  form.append(input, send);

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const text = input.value.trim();

    if (!text) return;

    send.disabled = true;

    const { error } = await db
      .from('comments')
      .insert({
        post_id: post.id,
        user_id: currentUser.id,
        content: text
      });

    send.disabled = false;

    if (error) {
      alert('Comment failed: ' + error.message);
      return;
    }

    input.value = '';
    await loadComments(post.id, comments);
  });

  article.append(head, content, actions, comments, form);
  $('feed').append(article);

  loadComments(post.id, comments);
}

async function toggleLike(postId) {
  const { data: existing, error: findError } = await db
    .from('post_likes')
    .select('id')
    .eq('post_id', postId)
    .eq('user_id', currentUser.id)
    .maybeSingle();

  if (findError) {
    alert('Could not check like: ' + findError.message);
    return;
  }

  let error;

  if (existing) {
    ({ error } = await db
      .from('post_likes')
      .delete()
      .eq('id', existing.id));
  } else {
    ({ error } = await db
      .from('post_likes')
      .insert({
        post_id: postId,
        user_id: currentUser.id
      }));
  }

  if (error) {
    alert('Like failed: ' + error.message);
    return;
  }

  await loadFeed();
}

async function loadComments(postId, container) {
  const { data, error } = await db
    .from('comments')
    .select('id, user_id, content, created_at')
    .eq('post_id', postId)
    .order('created_at', { ascending: true });

  if (error) {
    container.textContent = 'Could not load comments.';
    return;
  }

  container.replaceChildren();

  for (const comment of data || []) {
    const row = document.createElement('div');
    row.className = 'comment';

    const text = document.createElement('span');
    text.textContent = comment.content;

    row.append(text);
    container.append(row);
  }
}

async function logout() {
  const { error } = await db.auth.signOut();

  if (error) {
    alert('Logout failed: ' + error.message);
    return;
  }

  currentUser = null;
  $('app').style.display = 'none';
  $('auth').style.display = 'block';
  $('logout').style.display = 'none';
  $('account').textContent = '';
  showStatus('You have logged out.');
}

db.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
    if (session) {
      setTimeout(() => initialise(), 0);
    }
  }
});

initialise();

// Refresh the feed periodically so new posts appear on other devices.
setInterval(() => {
  if (currentUser && !busy) loadFeed();
}, 20000);
</script>

</body>
</html>
