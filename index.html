<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barchalor - Secure Owner Edition</title>
<style>
:root{--red:#e11d48;--bg:#fdf2f2}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:var(--bg);display:flex;height:100vh;justify-content:center;align-items:center}
#auth{background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center;width:380px}
#auth h1{color:var(--red);font-size:2.8rem;font-weight:900}
#auth input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:8px;background:#fff5f5;outline:none}
.btn{width:100%;padding:14px;background:var(--red);border:none;color:#fff;font-weight:700;border-radius:8px;cursor:pointer;margin-top:10px}
#app{display:none;width:100vw;height:100vh;grid-template-columns:260px 1fr 300px}
.side{background:#fff;border-right:1px solid #eee;padding:18px;display:flex;flex-direction:column}
.feed-area{display:flex;flex-direction:column;background:var(--bg);flex:1}
.hdr{background:#fff;padding:14px;display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid #eee}
.feed{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.post{padding:12px 16px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);max-width:75%}
.post.me{align-self:flex-end;background:var(--red);color:#fff}
.post img{width:100%;border-radius:10px;margin-top:8px;max-height:300px;object-fit:cover}
.ownerOnlyDel{color:red;font-weight:800;cursor:pointer;margin-left:8px;background:none;border:none}
.chatbox{position:fixed;bottom:0;right:16px;width:300px;height:360px;background:#fff;border-radius:12px 12px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:99}
.chatbox.on{display:flex}
</style>
</head>
<body>

<div id="auth">
<h1>barchalor</h1>
<p style="color:#666;margin:6px 0 14px">Secure Social Network</p>
<input id="u" placeholder="Email or Username"/>
<input id="p" type="password" placeholder="Password"/>
<button class="btn" onclick="login()">Log In</button>
<span onclick="toggle()" id="t" style="display:block;margin-top:10px;color:var(--red);cursor:pointer;font-weight:600">Create account</span>
<small style="display:block;margin-top:14px;color:#999">Owner: qlitobadys@gmail.com<br>Pass: barchalor123</small>
</div>

<div id="app">
<div class="side"><h2 style="color:var(--red)">barchalor</h2><div id="users" style="margin-top:16px;flex:1"></div><button onclick="logout()" style="padding:10px;border:none;background:#eee;border-radius:8px;font-weight:700;cursor:pointer">Log Out</button></div>
<div class="feed-area">
<div class="hdr"><span>🌍 Feed</span><span id="me"></span></div>
<div id="feed" class="feed"></div>
<div style="padding:10px;background:#fff;display:flex;gap:6px;border-top:1px solid #eee;align-items:center">
<input type="file" id="f" accept="image/*" hidden onchange="img(event)"/><button onclick="document.getElementById('f').click()" style="padding:10px;border-radius:20px;border:1px solid #eee;background:#fff5f5;cursor:pointer">📸</button>
<input id="msg" placeholder="What's on your mind?" style="flex:1;padding:12px;border-radius:24px;border:1px solid #eee;background:#fff5f5;outline:none" onkeydown="if(event.key==='Enter')post()"/>
<button onclick="post()" style="background:var(--red);color:#fff;border:none;padding:0 18px;border-radius:24px;font-weight:700;cursor:pointer">Post</button>
</div>
<div id="prevW" style="display:none;padding:0 10px 10px;background:#fff"><img id="prev" style="width:100%;max-height:150px;border-radius:10px;object-fit:cover"/><small onclick="clearImg()" style="color:red;cursor:pointer"> ✕ remove image</small></div>
</div>
<div style="background:#fff;border-left:1px solid #eee;padding:12px"><b>Messenger (Private)</b><small style="display:block;color:#888;margin:4px 0">Only you see your chats</small><div id="mList" style="margin-top:10px"></div></div>
</div>

<div id="chatBox" class="chatbox">
<div style="padding:10px;background:var(--red);color:#fff;display:flex;justify-content:space-between;border-radius:12px 12px 0 0"><b id="cName">Chat</b><span onclick="closeC()" style="cursor:pointer">✕</span></div>
<div id="cMsgs" style="flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px"></div>
<div style="display:flex;padding:8px;border-top:1px solid #eee"><input id="cIn" placeholder="Private message..." style="flex:1;border:none;background:#f0f2f5;border-radius:20px;padding:8px 12px;outline:none" onkeydown="if(event.key==='Enter')sendC()"/><button onclick="sendC()" style="margin-left:6px;background:var(--red);color:#fff;border:none;padding:8px 12px;border-radius:20px">Send</button></div>
</div>

<script>
const OWNER_EMAIL="qlitobadys@gmail.com";
const OWNER_PASS="barchalor123";
const SECRET_RESET="ownerreset";
const RESET_PIN="bady2026";
let isLogin=true;
let cur=localStorage.getItem('barchalor_current_user');
let DB=JSON.parse(localStorage.getItem('barchalor_local_db'))||{users:{},messages:[]};
let chats=JSON.parse(localStorage.getItem('barchalor_private_chats')||'{}');
let curChat=null;let pendImg=null;

// FORCE OWNER EXISTS BUT DON'T OVERRIDE IF ALREADY THERE
if(!DB.users[OWNER_EMAIL.toLowerCase()]){
DB.users[OWNER_EMAIL.toLowerCase()]={username:OWNER_EMAIL,password:OWNER_PASS,role:"owner"};
localStorage.setItem('barchalor_local_db',JSON.stringify(DB));
}
if(cur)showApp();

function toggle(){isLogin=!isLogin;document.querySelector('.btn').innerText=isLogin?'Log In':'Sign Up';document.getElementById('t').innerText=isLogin?'Create account':'Have account? Login';}

function login(){
const u=document.getElementById('u').value.trim();
const p=document.getElementById('p').value;
// HIDDEN OWNER RESET - only you know
if(u.toLowerCase()===SECRET_RESET){
let pin=prompt("Enter Secret PIN:");
if(pin!==RESET_PIN)return alert("Wrong PIN");
DB={users:{},messages:[]};
DB.users[OWNER_EMAIL.toLowerCase()]={username:OWNER_EMAIL,password:OWNER_PASS,role:"owner"};
localStorage.setItem('barchalor_local_db',JSON.stringify(DB));
localStorage.setItem('barchalor_current_user',OWNER_EMAIL);
alert("Owner reset done! Logging in as owner");
location.reload();return;
}
if(!u||!p)return alert("Fill fields");
const key=u.toLowerCase();
if(isLogin){
if(DB.users[key]&&DB.users[key].password===p){
localStorage.setItem('barchalor_current_user',DB.users[key].username);
cur=DB.users[key].username;showApp();
}else alert("Wrong login. If you are owner, type 'ownerreset' in email field");
}else{
if(DB.users[key])return alert("Account exists");
DB.users[key]={username:u,password:p,role:key===OWNER_EMAIL.toLowerCase()?"owner":"member"};
localStorage.setItem('barchalor_local_db',JSON.stringify(DB));
localStorage.setItem('barchalor_current_user',u);
cur=u;showApp();
}
}

function showApp(){
document.getElementById('auth').style.display='none';
document.getElementById('app').style.display='grid';
const isOwner=cur.toLowerCase()===OWNER_EMAIL.toLowerCase();
document.getElementById('me').innerHTML=cur+(isOwner?' <span style="background:gold;padding:2px 6px;border-radius:6px;font-size:10px">👑 OWNER</span>':'');
renderFeed();renderUsers();renderMlist();
}

function img(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{pendImg=ev.target.result;document.getElementById('prev').src=pendImg;document.getElementById('prevW').style.display='block';};r.readAsDataURL(f);}
function clearImg(){pendImg=null;document.getElementById('prevW').style.display='none';document.getElementById('f').value='';}

function post(){
const t=document.getElementById('msg').value.trim();
if(!t&&!pendImg)return;
DB.messages.unshift({user:cur,text:t,img:pendImg,time:new Date().toLocaleTimeString(),isOwner:cur.toLowerCase()===OWNER_EMAIL.toLowerCase()});
localStorage.setItem('barchalor_local_db',JSON.stringify(DB));
document.getElementById('msg').value='';clearImg();renderFeed();
}

function renderFeed(){
const feed=document.getElementById('feed');feed.innerHTML='';
const isOwner=cur.toLowerCase()===OWNER_EMAIL.toLowerCase();
DB.messages.forEach((m,i)=>{
const me=m.user===cur;
feed.innerHTML+=`<div class="post ${me?'me':''}">
<div style="font-size:11px;opacity:.8;margin-bottom:4px;font-weight:700">${m.user} ${m.isOwner?'👑':''} • ${m.time}
${isOwner?`<button class="ownerOnlyDel" onclick="del(${i})" style="color:${me?'#fff':'red'}"> [DELETE - Owner Only]</button>`:''}
</div>
<div>${m.text}</div>
${m.img?`<img src="${m.img}"/>`:''}
</div>`;
});
}

function del(i){
if(cur.toLowerCase()!==OWNER_EMAIL.toLowerCase())return alert("Only owner can delete!");
if(confirm("Owner delete this?")){DB.messages.splice(i,1);localStorage.setItem('barchalor_local_db',JSON.stringify(DB));renderFeed();}
}

function renderUsers(){
const d=document.getElementById('users');d.innerHTML='<small style="color:#888">MEMBERS</small><br><br>';
Object.values(DB.users).forEach(u=>{d.innerHTML+=`<div style="padding:8px;background:#fff5f5;border-radius:8px;margin-bottom:6px">${u.username} ${u.role==='owner'?'👑':''}</div>`});
}
function renderMlist(){
const l=document.getElementById('mList');l.innerHTML='';
Object.values(DB.users).forEach(u=>{
if(u.username!==cur){
l.innerHTML+=`<div onclick="openC('${u.username}')" style="padding:8px;background:#fff5f5;border-radius:8px;margin-bottom:6px;cursor:pointer">${u.username}<br><small style="color:green">● private chat</small></div>`;
}
});
}
function openC(name){
curChat=name;document.getElementById('cName').innerText=name;
document.getElementById('chatBox').classList.add('on');
// private key = cur + "->" + name, so only cur sees it
const key=cur+"=>"+name;
if(!chats[key])chats[key]=[{from:'them',text:'Hi, this is private chat with '+name}];
renderC(key);
document.getElementById('chatBox').dataset.key=key;
}
function closeC(){document.getElementById('chatBox').classList.remove('on');}
function renderC(key){
const box=document.getElementById('cMsgs');box.innerHTML='';
(chats[key]||[]).forEach(m=>{
box.innerHTML+=`<div style="padding:8px 12px;border-radius:18px;max-width:75%;${m.from==='me'?'align-self:flex-end;background:#e11d48;color:#fff':'align-self:flex-start;background:#f0f2f5'}">${m.text}</div>`;
});
box.scrollTop=box.scrollHeight;
}
function sendC(){
const inp=document.getElementById('cIn');if(!inp.value)return;
const key=document.getElementById('chatBox').dataset.key;
if(!chats[key])chats[key]=[];
chats[key].push({from:'me',text:inp.value});
inp.value='';
localStorage.setItem('barchalor_private_chats',JSON.stringify(chats));
renderC(key);
}
function logout(){localStorage.removeItem('barchalor_current_user');location.reload();}
</script>
</body>
</html>
