<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Barchalor - Social Community</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f0f2f5}
header{position:sticky;top:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.logo{font-weight:800;font-size:22px;color:#0866ff}.logo span{color:#000}
.search{background:#f0f2f5;padding:8px 14px;border-radius:20px;width:240px;border:none;outline:none}
.main{display:grid;grid-template-columns:260px 1fr 280px;gap:16px;max-width:1300px;margin:16px auto;padding:0 10px}
.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.1);margin-bottom:16px}
.owner-badge{background:linear-gradient(90deg,#ffcc00,#ff9900);color:#000;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.post-input{width:100%;background:#f0f2f5;border:none;padding:10px 14px;border-radius:20px;outline:none;margin-top:10px}
.btn{background:#0866ff;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-weight:600;cursor:pointer}
.btn:hover{background:#0756d6}
.post{margin-bottom:16px}
.post-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.avatar{width:40px;height:40px;border-radius:50%;background:#0866ff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;margin-top:10px;padding-top:8px}
.actions span{cursor:pointer;padding:6px 12px;border-radius:6px}.actions span:hover{background:#f0f2f5}
.chat-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}.chat-item:hover{background:#f0f2f5}
.online{width:10px;height:10px;background:#31a24c;border-radius:50%;border:2px solid #fff;margin-left:-14px;margin-top:18px}
.owner-panel{display:none;background:#111;color:#fff;padding:12px;border-radius:10px;margin-bottom:16px}
.owner-panel.active{display:block}
@media(max-width:900px){.main{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<header>
<div class="logo">barchalor <span>social</span></div>
<input class="search" placeholder="Search Barchalor"/>
<div style="display:flex;gap:8px;align-items:center">
<div class="avatar">Q</div>
<b>Qlito bady s <span class="owner-badge">👑 OWNER</span></b>
</div>
</header>

<div class="main">
<!-- LEFT -->
<div class="hide-m">
<div class="card">
<b>👑 Owner Panel</b><br><small>Only visible to you</small><br><br>
<button class="btn" onclick="toggleOwner()">Open Owner Dashboard</button>
<div id="ownerPanel" class="owner-panel" style="margin-top:12px">
<p>Total Posts: <b id="totalPosts">0</b></p>
<p>Total Users: <b>1,247</b> (demo)</p>
<p>Status: <b style="color:#0f0">You are OWNER</b></p>
<button class="btn" style="background:#ff3b30;margin-top:8px" onclick="clearAll()">Delete All Posts (Owner)</button>
</div>
</div>
<div class="card">
<p><b>🏠 Feed</b></p><br><p>👥 Friends</p><br><p>💬 Messages</p><br><p>👑 Owner Tools</p>
</div>
</div>

<!-- CENTER -->
<div>
<div class="card">
<div style="display:flex;gap:10px">
<div class="avatar">Q</div>
<input id="postText" class="post-input" placeholder="What's on your mind, Qlito bady s? (Owner)"/>
</div>
<button class="btn" style="margin-top:10px;width:100%" onclick="createPost()">Post as Owner 👑</button>
</div>
<div id="feed"></div>
</div>

<!-- RIGHT -->
<div class="hide-m">
<div class="card">
<b>Contacts - Chat</b>
<div class="chat-item"><div class="avatar" style="background:#e1306c">A</div><span>Amara</span><div class="online"></div></div>
<div class="chat-item"><div class="avatar" style="background:#000">J</div><span>John Doe</span><div class="online"></div></div>
<div class="chat-item"><div class="avatar" style="background:#ff9900">C</div><span>Chidera</span><div class="online"></div></div>
<div style="margin-top:10px;padding:8px;background:#f0f2f5;border-radius:8px">
<small>Messenger preview - Owner can chat with anyone</small>
</div>
</div>
</div>
</div>

<script>
const OWNER_NAME = "Qlito bady s";
let posts = JSON.parse(localStorage.getItem('barchalor_posts')||'[]');
if(posts.length==0){
posts=[
{name:"Qlito bady s",text:"Welcome to BARCHALOR SOCIAL! I am the Owner 👑 This is our own Facebook-like community. Drop your first post!",likes:12,time:"Just now",isOwner:true},
{name:"Amara",text:"This community is fire 🔥 Congrats Qlito!",likes:3,time:"2m ago",isOwner:false}
];
}

function render(){
const feed=document.getElementById('feed');
feed.innerHTML="";
posts.forEach((p,i)=>{
const ownerTag = p.isOwner?'<span class="owner-badge">👑 OWNER</span>':'';
const delBtn = `<span style="color:red;cursor:pointer" onclick="deletePost(${i})">Delete ${p.isOwner?'':' (Owner only)'}</span>`;
feed.innerHTML+=`
<div class="card post">
<div class="post-head">
<div style="display:flex;gap:10px;align-items:center">
<div class="avatar">${p.name[0]}</div>
<div><b>${p.name} ${ownerTag}</b><br><small>${p.time}</small></div>
</div>
<div>${delBtn}</div>
</div>
<p style="margin:12px 0">${p.text}</p>
<div class="actions">
<span onclick="likePost(${i})">👍 Like (${p.likes})</span>
<span>💬 Comment</span>
<span>↗️ Share</span>
</div>
</div>`;
});
document.getElementById('totalPosts').innerText=posts.length;
localStorage.setItem('barchalor_posts',JSON.stringify(posts));
}
function createPost(){
const t=document.getElementById('postText').value;
if(!t)return;
posts.unshift({name:OWNER_NAME,text:t,likes:0,time:"Just now",isOwner:true});
document.getElementById('postText').value="";
render();
}
function likePost(i){posts[i].likes++;render();}
function deletePost(i){
if(posts[i].name!==OWNER_NAME &&!confirm("As OWNER you can delete any post. Delete this?")){}
posts.splice(i,1);render();
}
function toggleOwner(){document.getElementById('ownerPanel').classList.toggle('active')}
function clearAll(){if(confirm("Owner: Delete all posts?")){posts=[];render();}}
render();
</script>
</body>
</html>
