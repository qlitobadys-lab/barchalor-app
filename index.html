<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box;margin:0}body{background:#000;color:#fff;font-family:sans-serif;height:100vh}.b{width:90%;max-width:340px;height:48px;border:2px solid #FF2B2B;border-radius:12px;background:#000;color:#fff;padding:0 14px;margin:8px 0;outline:none}.c{width:90%;max-width:340px;height:48px;border-radius:28px;border:2px solid #FF2B2B;background:#000;color:#FF2B2B;font-weight:700;margin:8px 0}.d{width:90%;max-width:340px;height:48px;border-radius:28px;background:#FF2B2B;color:#000;font-weight:700;border:none;margin:8px 0}#m{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}.me{align-self:flex-end;background:#FF2B2B;color:#000;padding:8px 12px;border-radius:14px;max-width:75%}.th{align-self:flex-start;background:#222;padding:8px 12px;border-radius:14px;max-width:75%}</style><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,setDoc,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const cfg={apiKey:"AIzaSyD74zIkwLsTjv_u_vdYqOy5Kv4pRDzd8hI",authDomain:"barchalor.firebaseapp.com",projectId:"barchalor",storageBucket:"barchalor.firebasestorage.app",messagingSenderId:"404904480968",appId:"1:404904480968:web:f53c8182ee4202dc8795fd"};const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);let chatId=null;window.signup=async()=>{let e=email.value.trim().toLowerCase(),p=pass.value;if(!e||!p)return alert('Enter email/pass');try{let c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,"users",c.user.uid),{email:e,name:e.split('@')[0],owner:e=='qlitobadys@gmail.com'});alert(e=='qlitobadys@gmail.com'?' Owner created!':'Account created!')}catch(x){alert(x.message)}};window.login=async()=>{try{await signInWithEmailAndPassword(auth,email.value,pass.value)}catch(x){alert(x.message)}};onAuthStateChanged(auth,async u=>{if(u){authDiv.style.display='none';chatsDiv.style.display='flex';let s=await getDocs(collection(db,'users'));list.innerHTML='';s.forEach(d=>{if(d.id==u.uid)return;let v=d.data();let el=document.createElement('div');el.style.cssText='padding:12px;border-bottom:1px solid #222;cursor:pointer';el.innerHTML='<b>'+v.name+'</b> '+(v.owner?' OWNER':'')+'<br><small style=color:#777>'+v.email+'</small>';el.onclick=()=>openChat(d.id,v.name);list.appendChild(el)});if(list.innerHTML=='')list.innerHTML='<div style=padding:40px;text-align:center;color:#555>No users yet</div>'}else{authDiv.style.display='flex';chatsDiv.style.display='none';room.style.display='none'}});window.openChat=(id,name)=>{chatId=[auth.currentUser.uid,id].sort().join('_');room.style.display='flex';chatsDiv.style.display='none';rname.textContent=name;let q=query(collection(db,'chats',chatId,'messages'),orderBy('time'));onSnapshot(q,s=>{m.innerHTML='';s.forEach(x=>{let d=x.data();let dv=document.createElement('div');dv.className=d.sender==auth.currentUser.uid?'me':'th';dv.textContent=d.text;m.appendChild(dv)});m.scrollTop=m.scrollHeight})};window.send=async()=>{let t=msg.value.trim();if(!t||!chatId)return;msg.value='';await addDoc(collection(db,'chats',chatId,'messages'),{text:t,sender:auth.currentUser.uid,time:serverTimestamp()})};window.back=()=>{room.style.display='none';chatsDiv.style.display='flex'};window.logout=()=>{signOut(auth);location.reload()};</script></head><body><div id="authDiv" style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:70px;color:#FF2B2B;font-weight:900;border:3px solid #FF2B2B;width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center">B</div><div style="color:#FF2B2B;margin:12px 0;font-size:18px">Welcome to Barchalor</div><div style="font-size:10px;color:#555;margin-bottom:10px">From Qlito • Owner: qlitobadys@gmail.com</div><input id="email" class="b" placeholder="email@example.com"><input id="pass" type="password" class="b" placeholder="password"><button class="d" onclick="signup()">Sign up</button><button class="c" onclick="login()">Login</button></div><div id="chatsDiv" style="height:100vh;display:none;flex-direction:column"><div style="padding:14px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center"><b>Chats <span style="color:#FF2B2B">Barchalor</span></b><span onclick="logout()" style="color:#FF2B2B;cursor:pointer">Logout</span></div><div id="list" style="flex:1;overflow:auto"></div></div><div id="room" style="height:100vh;display:none;flex-direction:column;position:fixed;top:0;left:0;width:100%;background:#000"><div style="padding:12px;border-bottom:1px solid #222;display:flex;gap:10px;align-items:center"><span onclick="back()" style="color:#FF2B2B;font-size:22px;cursor:pointer"></span><b id="rname"></b></div><div id="m"></div><div style="display:flex;gap:8px;padding:10px;border-top:1px solid #222"><input id="msg" placeholder="Type message" style="flex:1;background:#111;border:1px solid #222;border-radius:22px;padding:10px 14px;color:#fff;outline:none" onkeypress="if(event.key==='Enter')send()"><button onclick="send()" style="width:42px;height:42px;border-radius:50%;background:#FF2B2B;border:none;font-weight:900"></button></div></div></body></html>
