require('dotenv').config();
const express = require('express');
const http = require('http');
const { Server } = require('socket.io');
const mongoose = require('mongoose');
const bcrypt = require('bcryptjs');
const jwt = require('jsonwebtoken');
const path = require('path');

const app = express();
const server = http.createServer(app);
const io = new Server(server, { cors: { origin: "*" } });

const PORT = process.env.PORT || 3000;
const JWT_SECRET = process.env.JWT_SECRET || 'bachelor_super_secret_key';
const MONGO_URI = process.env.MONGODB_URI || 'mongodb://127.0.0.1:27017/bachelor';

mongoose.connect(MONGO_URI)
  .then(() => console.log('📦 Connected securely to MongoDB'))
  .catch(err => console.error('❌ Database connection error:', err));

const User = mongoose.model('User', new mongoose.Schema({
    username: { type: String, unique: true, required: true },
    password: { type: String, required: true }
}));

const Message = mongoose.model('Message', new mongoose.Schema({
    user: String,
    text: String,
    timestamp: { type: Date, default: Date.now }
}));

app.use(express.json());
app.use(express.static(__dirname));

app.post('/api/auth/register', async (req, res) => {
    try {
        const { username, password } = req.body;
        if (!username || !password) return res.status(400).json({ error: 'All fields required' });
        const exists = await User.findOne({ username });
        if (exists) return res.status(400).json({ error: 'Username already taken' });
        const hashedPassword = await bcrypt.hash(password, 10);
        const newUser = new User({ username, password: hashedPassword });
        await newUser.save();
        const token = jwt.sign({ username }, JWT_SECRET, { expiresIn: '7d' });
        res.status(201).json({ token, username });
    } catch (err) { res.status(500).json({ error: 'Server error' }); }
});

app.post('/api/auth/login', async (req, res) => {
    try {
        const { username, password } = req.body;
        const user = await User.findOne({ username });
        if (!user || !await bcrypt.compare(password, user.password)) return res.status(400).json({ error: 'Invalid credentials' });
        const token = jwt.sign({ username }, JWT_SECRET, { expiresIn: '7d' });
        res.json({ token, username });
    } catch (err) { res.status(500).json({ error: 'Server error' }); }
});

const onlineUsers = {};
io.on('connection', (socket) => {
    socket.on('join-community', async (username) => {
        onlineUsers[socket.id] = username;
        const history = await Message.find().sort({ timestamp: -1 }).limit(50);
        socket.emit('chat-history', history.reverse());
        io.emit('update-online-list', Object.values(onlineUsers));
    });
    socket.on('send-message', async (text) => {
        const username = onlineUsers[socket.id];
        if (!username || !text.trim()) return;
        const newMessage = new Message({ user: username, text: text.trim() });
        await newMessage.save();
        io.emit('message-received', { user: newMessage.user, text: newMessage.text, timestamp: newMessage.timestamp });
    });
    socket.on('disconnect', () => {
        delete onlineUsers[socket.id];
        io.emit('update-online-list', Object.values(onlineUsers));
    });
});
server.listen(PORT, () => console.log(`🚀 Bachelor online at port ${PORT}`));
